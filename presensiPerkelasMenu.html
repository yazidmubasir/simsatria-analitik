<script>
  function menuPresensiPerkelas() {
    const content = document.getElementById('content');
    if (!content) return;

    content.innerHTML = `
      <div class="d-flex flex-column align-items-center justify-content-center" style="min-height:300px;">
        <div class="spinner-border"></div>
        <div class="mt-3 text-muted">Memuat Presensi Per Kelas...</div>
      </div>
    `;

    google.script.run
      .withSuccessHandler(function(view) {
        if (!view || !view.success || !view.html) {
          content.innerHTML = `
            <div class="alert alert-danger">
              Presensi Per Kelas gagal dimuat.
            </div>
          `;
          return;
        }

        // Render HTML terlebih dahulu.
        content.innerHTML = view.html;

        // Jalankan JS modul setelah elemen HTML tersedia.
        if (view.js && view.js.trim()) {
          const oldScript = document.getElementById('ppRuntimeScript');
          if (oldScript) oldScript.remove();

          const script = document.createElement('script');
          script.id = 'ppRuntimeScript';
          script.type = 'text/javascript';
          script.textContent = view.js;
          document.body.appendChild(script);

          // PENTING: script yang di-inject hanya mendefinisikan fungsi.
          // PP_init() harus dipanggil setelah HTML dan JS tersedia.
          setTimeout(function() {
            try {
              if (typeof PP_init === 'function') {
                PP_init();
              } else {
                throw new Error('PP_init() tidak ditemukan pada modul Presensi Per Kelas.');
              }
            } catch (e) {
              console.error('PP_INIT ERROR:', e);
              const box = document.getElementById('ppTableContainer');
              if (box) {
                box.innerHTML = `
                  <div class="alert alert-danger mx-3 my-3 small">
                    <strong>Presensi gagal diinisialisasi.</strong><br>
                    ${String(e && e.message ? e.message : e)}
                  </div>
                `;
              }
            }
          }, 0);
        } else {
          content.innerHTML = `
            <div class="alert alert-danger">
              Modul JavaScript Presensi Per Kelas tidak ditemukan.
            </div>
          `;
        }
      })
      .withFailureHandler(function(error) {
        const message = error && error.message
          ? error.message
          : 'Presensi gagal dimuat.';
        content.innerHTML = `
          <div class="alert alert-danger">
            ${String(message).replace(/[&<>\"']/g, function(c) {
              return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c];
            })}
          </div>
        `;
      })
      .getPresensiPerkelasView();
  }
</script>
