/* =========================================================
   INIT DATE
   ========================================================= */
function agendaSetToday() {
  const el = document.getElementById('tanggalAgenda');
  if (!el || el.value) return;

  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  el.value = `${yyyy}-${mm}-${dd}`;
}

/* =========================================================
   LOAD MULTI SCHOOL
   ========================================================= */
function loadAgendaMultiSchool() {

  setAgendaAlert('', '');

  google.script.run
    .withSuccessHandler(function(result) {

      if (!result || !result.success) {
        setAgendaAlert(
          result && result.message
            ? result.message
            : 'Gagal memuat School Context / Guru.',
          'danger'
        );
        return;
      }

      agendaSchoolContext = result.school || {};
      agendaUserContext = result.user || {};
      dataGuruAgenda = Array.isArray(result.data) ? result.data : [];

      const schoolEl = document.getElementById('agendaSchoolName');
      if (schoolEl) {
        schoolEl.textContent =
          (agendaSchoolContext.namaSekolah || 'Sekolah aktif') +
          (agendaSchoolContext.npsn ? ' • NPSN ' + agendaSchoolContext.npsn : '');
      }

      renderGuruAgenda(dataGuruAgenda, agendaUserContext);
      loadKelasAgenda();
    })
    .withFailureHandler(function(err) {
      setAgendaAlert(
        'Gagal memuat data guru: ' + (err && err.message ? err.message : err),
        'danger'
      );
    })
    .getGuruAgenda();
}

/* =========================================================
   LOAD KELAS
   ========================================================= */
function loadKelasAgenda() {

  const select = document.getElementById('kelasAgenda');
  if (!select) return;

  select.disabled = true;
  select.innerHTML = '<option value="">Memuat kelas...</option>';

  google.script.run
    .withSuccessHandler(function(result) {

      if (!result || !result.success) {
        select.innerHTML = '<option value="">Kelas tidak tersedia</option>';
        return;
      }

      const kelas = Array.isArray(result.kelas) ? result.kelas : [];

      if (!kelas.length) {
        select.innerHTML = '<option value="">Belum ada data kelas</option>';
        select.disabled = true;
        setAgendaAlert(
          'Sheet Kelas sekolah aktif belum memiliki daftar kelas.',
          'warning'
        );
        return;
      }

      select.innerHTML = '<option value="">-- Pilih Kelas --</option>';

      kelas.forEach(function(namaKelas) {
        const option = document.createElement('option');
        option.value = namaKelas;
        option.textContent = namaKelas;
        select.appendChild(option);
      });

      select.disabled = false;
    })
    .withFailureHandler(function(err) {
      select.innerHTML = '<option value="">Gagal memuat kelas</option>';
      select.disabled = true;
      setAgendaAlert(
        'Gagal memuat kelas: ' + (err && err.message ? err.message : err),
        'danger'
      );
    })
    .getKelasAgendaGuru();
}

/* =========================================================
   RENDER GURU
   GURU: hanya guru login.
   ADMIN/PENGAWAS: seluruh guru sekolah aktif.
   ========================================================= */
function renderGuruAgenda(data, user) {

  const select = document.getElementById('guru');
  if (!select) return;

  const role = String(user && user.role || '').trim().toUpperCase();
  const userNip = String(user && user.nip || '').trim();
  const userId = String(user && user.userId || '').trim();
  const userEmail = String(user && user.email || '').trim().toLowerCase();
  const userNama = String(user && user.nama || '').trim().toLowerCase();

  const isGuru =
    role === 'GURU' ||
    role === 'GURU_MAPEL' ||
    role === 'GURU_WALI' ||
    role === 'GURU_PIKET';

  let daftar = data || [];

  if (isGuru) {
    daftar = daftar.filter(function(g) {
      const byNip = userNip && String(g.nip || '').trim() === userNip;
      const byEmail = userEmail && String(g.email || '').trim().toLowerCase() === userEmail;
      const byNama = userNama && String(g.nama || '').trim().toLowerCase() === userNama;
      return byNip || byEmail || byNama;
    });
  }

  if (!daftar.length) {
    select.innerHTML =
      '<option value="">Data guru login tidak ditemukan</option>';
    select.disabled = true;
    return;
  }

  select.disabled = false;
  select.innerHTML = isGuru
    ? ''
    : '<option value="">-- Pilih Guru --</option>';

  daftar.forEach(function(g) {
    const option = document.createElement('option');
    option.value = g.nip || '';
    option.textContent = g.nama || g.nip || '-';
    option.dataset.mapel = g.mapel || '';
    option.dataset.email = g.email || '';
    select.appendChild(option);
  });

  select.onchange = function() {
    const selected = daftar.find(function(g) {
      return String(g.nip || '') === String(select.value || '');
    });
    setGuruAgenda(selected);
  };

  setGuruAgenda(daftar[0]);
}

function setGuruAgenda(guru) {
  document.getElementById('nip').value = guru ? guru.nip || '' : '';
  document.getElementById('mapel').value = guru ? guru.mapel || '' : '';
}

  if (!file) return;

  document.getElementById('previewAgenda').src =
    URL.createObjectURL(file);

function gantiSumberDokumentasi() {
  const upload = document.getElementById('radioUpload').checked;
  const uploadArea = document.getElementById('uploadArea');
  const linkArea = document.getElementById('linkArea');

  uploadArea.classList.toggle('d-none', !upload);
  linkArea.classList.toggle('d-none', upload);
}

/* =========================================================
   KOMPRES FOTO
   ========================================================= */
function compressImage(file) {
  return new Promise(function(resolve, reject) {

    const reader = new FileReader();

    reader.onload = function(e) {
      const img = new Image();

      img.onload = function() {

        const maxWidth = 1280;
        const maxHeight = 1280;
        let width = img.width;
        let height = img.height;

        if (width > height && width > maxWidth) {
          height *= maxWidth / width;
          width = maxWidth;
        }

        if (height >= width && height > maxHeight) {
          width *= maxHeight / height;
          height = maxHeight;
        }

        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width);
        canvas.height = Math.round(height);

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(function(blob) {
          if (!blob) {
            reject(new Error('Gagal mengompres foto.'));
            return;
          }

          const fr = new FileReader();
          fr.onload = function() {
            resolve(fr.result);
          };
          fr.onerror = reject;
          fr.readAsDataURL(blob);
        }, 'image/jpeg', 0.6);
      };

      img.onerror = function() {
        reject(new Error('File foto tidak dapat dibaca.'));
      };

      img.src = e.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   LOADING
   ========================================================= */
function showLoadingAgenda() {
  const btn = document.getElementById('btnSimpanAgenda');
  if (btn) btn.disabled = true;

  document.getElementById('spinnerAgenda').classList.remove('d-none');
  document.getElementById('iconAgenda').classList.add('d-none');
  document.getElementById('textAgenda').textContent = 'Menyimpan data...';
  document.getElementById('loadingAgenda').classList.remove('d-none');
}

function hideLoadingAgenda() {
  const btn = document.getElementById('btnSimpanAgenda');
  if (btn) btn.disabled = false;

  document.getElementById('spinnerAgenda').classList.add('d-none');
  document.getElementById('iconAgenda').classList.remove('d-none');
  document.getElementById('textAgenda').textContent = 'Simpan Satria Mengajar';
  document.getElementById('loadingAgenda').classList.add('d-none');
}

/* =========================================================
   ALERT
   ========================================================= */
function setAgendaAlert(message, type) {
  const el = document.getElementById('agendaAlert');
  if (!el) return;

  if (!message) {
    el.className = 'alert d-none small';
    el.textContent = '';
    return;
  }

  el.className = 'alert alert-' + (type || 'info') + ' small';
  el.textContent = message;
}

/* =========================================================
   RESET
   ========================================================= */
function resetAgendaGuru() {
  document.getElementById('tanggalAgenda').value = '';
  document.getElementById('tujuan').value = '';
  document.getElementById('materi').value = '';
  document.getElementById('siswaTidakMasuk').value = '';
  document.getElementById('ketGuru').value = '';
  document.getElementById('fotoGuru').value = '';
  document.getElementById('linkFotoGuru').value = '';

  document.getElementById('previewAgenda').src =
    'https://via.placeholder.com/300x220?text=Preview+Dokumentasi';

  document.querySelectorAll(
    '.sesiCheck,.dplCheck,.pmCheck,.prinsipCheck'
  ).forEach(function(el) {
    el.checked = false;
  });

  agendaSetToday();
}

/* =========================================================
   SIMPAN AGENDA
   ========================================================= */
function simpanAgendaGuruForm() {

  const guruSelect = document.getElementById('guru');
  const guru = guruSelect ? guruSelect.value : '';
  const nip = document.getElementById('nip').value.trim();
  const mapel = document.getElementById('mapel').value.trim();
  const tanggal = document.getElementById('tanggalAgenda').value;
  const kelas = document.getElementById('kelasAgenda').value;
  const tujuan = document.getElementById('tujuan').value.trim();
  const materi = document.getElementById('materi').value.trim();
  const siswaTidakMasuk = document.getElementById('siswaTidakMasuk').value.trim();
  const keterangan = document.getElementById('ketGuru').value.trim();

  const sesi = Array.from(
    document.querySelectorAll('.sesiCheck:checked')
  ).map(function(e) { return e.value; });

  const dpl = Array.from(
    document.querySelectorAll('.dplCheck:checked')
  ).map(function(e) { return e.value; });

  const pm = Array.from(
    document.querySelectorAll('.pmCheck:checked')
  ).map(function(e) { return e.value; });

  const prinsip = Array.from(
    document.querySelectorAll('.prinsipCheck:checked')
  ).map(function(e) { return e.value; });

  const pakaiUpload = document.getElementById('radioUpload').checked;
  const linkFoto = document.getElementById('linkFotoGuru').value.trim();
  const file = document.getElementById('fotoGuru').files[0];

  /* VALIDASI */
  if (!guru) return setAgendaAlert('Guru wajib dipilih.', 'warning');
  if (!nip) return setAgendaAlert('NIP guru tidak tersedia.', 'warning');
  if (!tanggal) return setAgendaAlert('Tanggal wajib diisi.', 'warning');
  if (!kelas) return setAgendaAlert('Kelas wajib dipilih.', 'warning');
  if (!sesi.length) return setAgendaAlert('Pilih minimal 1 jam.', 'warning');
  if (!tujuan) return setAgendaAlert('Tujuan Pembelajaran wajib diisi.', 'warning');
  if (!materi) return setAgendaAlert('Materi Pembelajaran wajib diisi.', 'warning');
  if (!dpl.length) return setAgendaAlert('Pilih minimal satu Dimensi Profil Lulusan.', 'warning');
  if (!pm.length) return setAgendaAlert('Pilih minimal satu Pengalaman Belajar.', 'warning');
  if (!prinsip.length) return setAgendaAlert('Pilih minimal satu Prinsip Pembelajaran.', 'warning');
  if (!keterangan) return setAgendaAlert('Keterangan wajib diisi.', 'warning');

  if (pakaiUpload) {
    if (!file) return setAgendaAlert('Silakan pilih foto.', 'warning');
    if (file.size > 2 * 1024 * 1024) {
      return setAgendaAlert('Ukuran foto maksimal 2 MB.', 'warning');
    }
  } else if (!linkFoto) {
    return setAgendaAlert('Masukkan link Google Drive.', 'warning');
  }

  const selectedOption = guruSelect.options[guruSelect.selectedIndex];

  const dataObj = {
    nip: nip,
    namaGuru: selectedOption ? selectedOption.text.trim() : '',
    mapel: mapel,
    tanggal: tanggal,
    sesi: sesi.join(', '),
    kelas: kelas,

    /* NAMA FIELD HARUS SAMA DENGAN HEADER TRX */
    tujuanPembelajaran: tujuan,
    materiPembelajaran: materi,
    dpl: dpl.join(', '),
    pengalamanBelajar: pm.join(', '),
    prinsipPembelajaran: prinsip.join(', '),
    rekapMuridTidakIkut: siswaTidakMasuk,
    keterangan: keterangan,
    buktiFisik: ''
  };

  setAgendaAlert('', '');
  showLoadingAgenda();

  /* LINK */
  if (!pakaiUpload) {
    dataObj.buktiFisik = linkFoto;
    prosesSimpanAgenda(dataObj);
    return;
  }

  /* UPLOAD */
  compressImage(file)
    .then(function(base64) {

      google.script.run
        .withSuccessHandler(function(result) {

          if (!result || !result.success) {
            hideLoadingAgenda();
            setAgendaAlert(
              result && result.message
                ? result.message
                : 'Upload foto gagal.',
              'danger'
            );
            return;
          }

          dataObj.buktiFisik = result.url || '';
          prosesSimpanAgenda(dataObj);
        })
        .withFailureHandler(function(err) {
          hideLoadingAgenda();
          setAgendaAlert(
            'Upload foto gagal: ' + (err && err.message ? err.message : err),
            'danger'
          );
        })
        .uploadFileAgenda(
          base64,
          'Agenda_' + Date.now() + '.jpg'
        );
    })
    .catch(function(err) {
      hideLoadingAgenda();
      setAgendaAlert(
        'Gagal memproses foto: ' + (err && err.message ? err.message : err),
        'danger'
      );
    });
}

/* =========================================================
   SIMPAN KE SERVER
   ========================================================= */
function prosesSimpanAgenda(dataObj) {

  google.script.run
    .withSuccessHandler(function(result) {

      hideLoadingAgenda();

      if (!result || !result.success) {
        setAgendaAlert(
          result && result.message
            ? result.message
            : 'Agenda gagal disimpan.',
          'danger'
        );
        return;
      }

      setAgendaAlert(
        result.message +
        ' Transaction ID: ' +
        result.transactionId,
        'success'
      );

      resetAgendaGuru();
    })
    .withFailureHandler(function(err) {
      hideLoadingAgenda();
      setAgendaAlert(
        'Gagal menyimpan agenda: ' + (err && err.message ? err.message : err),
        'danger'
      );
    })
    .simpanAgendaGuru(dataObj);
}
