<section class="card shadow-sm border-0 mb-3" id="userSyncPanel">
  <div class="card-header d-flex align-items-center justify-content-between">
    <div>
      <strong>Sinkronkan Semua Pengguna Sekolah</strong>
      <div class="small text-muted">Masukkan email guru sekali saja. Sistem membuat akun GURU, binding sekolah, dan akses database secara otomatis.</div>
    </div>
    <span class="badge bg-success">ADMIN SEKOLAH</span>
  </div>
  <div class="card-body">
    <label for="userSyncEmails" class="form-label fw-semibold">Daftar Email Guru</label>
    <textarea id="userSyncEmails" class="form-control" rows="5" placeholder="guru1@gmail.com
guru2@gmail.com
guru3@gmail.com"></textarea>
    <div class="form-text mb-3">
      Satu email per baris. Bisa juga dipisahkan dengan koma. Format opsional: email|Nama Guru|NIP.
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-success" onclick="syncAllSchoolUsersUI()">
        <span class="me-1">↻</span> Sinkronkan Semua Pengguna
      </button>
      <button type="button" class="btn btn-outline-success" onclick="syncExistingSchoolUsersUI()">
        <span class="me-1">⟳</span> Sinkronkan USERS yang Sudah Ada
      </button>
      <button type="button" class="btn btn-outline-secondary" onclick="clearUserSyncUI()">
        Bersihkan
      </button>
    </div>
    <div id="userSyncResult" class="mt-3"></div>
  </div>
</section>
